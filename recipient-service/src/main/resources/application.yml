server:
  port: 8081

spring:
  application:
    name: recipient-service

  datasource:
    url: jdbc:mysql://localhost:3306/recipient_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: recipient_user
    password: recipient_pass
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    it.vnuzzo: INFO
