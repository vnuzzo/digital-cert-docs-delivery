server:
  port: 8084

spring:
  application:
    name: tracking-service

  data:
    mongodb:
      uri: mongodb://admin:adminpassword@localhost:27017/tracking_service?authSource=admin

  cloud:
    function:
      definition: trackingEventConsumer
    stream:
      bindings:
        trackingEventConsumer-in-0:
          destination: request.events,delivery.events
          group: tracking-service
          contentType: application/json
          consumer:
            maxAttempts: 3
            backOffInitialInterval: 1000
            backOffMultiplier: 2.0
            backOffMaxInterval: 10000
            concurrency: 3
      kafka:
        binder:
          brokers: localhost:9092
        bindings:
          trackingEventConsumer-in-0:
            consumer:
              enableDlq: true
              configuration:
                key.deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
                value.deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
                auto.offset.reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    defaults:
      enabled: true

logging:
  level:
    root: INFO
    it.vnuzzo: INFO
    org.springframework.cloud.stream: INFO
    org.springframework.kafka: WARN
    org.springframework.data.mongodb: WARN

app:
  tracking:
    consumer-name: tracking-service:tracking.events